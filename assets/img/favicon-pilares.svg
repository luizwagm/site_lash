<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LA">
  <defs>
    <linearGradient id="fpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67bff"/>
      <stop offset="0.5" stop-color="#6d5cff"/>
      <stop offset="1" stop-color="#22e3d6"/>
    </linearGradient>
    <linearGradient id="fpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191a2e"/>
      <stop offset="0.6" stop-color="#0e0e1a"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="fpNebula" cx="0.35" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fpNebula2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#22e3d6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22e3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fpBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54f2e6"/>
      <stop offset="0.42" stop-color="#6d5cff"/>
      <stop offset="1" stop-color="#3a3190"/>
    </linearGradient>
    <linearGradient id="fpBarDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b64c9"/>
      <stop offset="1" stop-color="#272456"/>
    </linearGradient>
    <linearGradient id="fpL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd6ff"/>
    </linearGradient>
    <radialGradient id="fpSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#bcaaff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#bcaaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fpBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="fpClip"><rect x="4" y="4" width="92" height="92" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#fpClip)">
    <rect x="4" y="4" width="92" height="92" fill="url(#fpSky)"/>
    <rect x="4" y="4" width="92" height="92" fill="url(#fpNebula)"/>
    <rect x="4" y="4" width="92" height="92" fill="url(#fpNebula2)"/>

    <!-- estrelas -->
    <circle cx="18" cy="16" r="1.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="84" cy="14" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="90" cy="34" r="1" fill="#bcaaff" opacity="0.5"/>

    <!-- camada distante -->
    <rect x="28" y="44" width="7" height="30" rx="3.5" fill="url(#fpBarDim)" opacity="0.5"/>
    <rect x="41" y="34" width="7" height="40" rx="3.5" fill="url(#fpBarDim)" opacity="0.45"/>
    <rect x="70" y="42" width="7" height="32" rx="3.5" fill="url(#fpBarDim)" opacity="0.5"/>

    <!-- glow da fundação -->
    <rect x="17" y="72" width="66" height="10" rx="5" fill="#22e3d6" opacity="0.35" filter="url(#fpBlur)"/>

    <!-- L branco: pilar + fundação -->
    <rect x="17" y="42" width="10" height="34" rx="4.5" fill="url(#fpL)"/>
    <rect x="17" y="74" width="66" height="8" rx="4" fill="url(#fpL)"/>
    <rect x="18.6" y="44" width="2.2" height="18" rx="1.1" fill="#ffffff" opacity="0.9"/>

    <!-- pilares principais -->
    <rect x="33" y="50" width="10" height="24" rx="4.5" fill="url(#fpBar)" opacity="0.92"/>
    <rect x="34.6" y="52" width="2" height="11" rx="1" fill="#aef7f0" opacity="0.55"/>

    <rect x="47" y="21" width="10" height="53" rx="4.5" fill="url(#fpBar)"/>
    <rect x="48.6" y="23.5" width="2" height="23" rx="1" fill="#d8fffb" opacity="0.75"/>

    <rect x="61" y="38" width="10" height="36" rx="4.5" fill="url(#fpBar)" opacity="0.96"/>
    <rect x="62.6" y="40" width="2" height="16" rx="1" fill="#aef7f0" opacity="0.6"/>

    <rect x="75" y="55" width="8" height="19" rx="4" fill="url(#fpBar)" opacity="0.88"/>

    <!-- spark -->
    <circle cx="52" cy="13" r="12" fill="url(#fpSpark)"/>
    <path d="M52 4 L54.7 10.4 L61 13 L54.7 15.6 L52 22 L49.3 15.6 L43 13 L49.3 10.4 Z" fill="#ffffff"/>
  </g>

  <rect x="4.9" y="4.9" width="90.2" height="90.2" rx="23.2" fill="none" stroke="url(#fpGrad)" stroke-width="1.8" stroke-opacity="0.9"/>
</svg>
