<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LA">
  <defs>
    <linearGradient id="fBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee7da"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="fL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ddff"/>
    </linearGradient>
    <linearGradient id="fBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#2ee7da"/>
    </linearGradient>
  </defs>
  <!-- tile escuro minimalista (só para contraste na aba) -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#0e0e1a"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="url(#fBorder)" stroke-width="1.4" stroke-opacity="0.85"/>
  <!-- barras -->
  <rect x="24"   y="26" width="6" height="18" rx="3" fill="url(#fBar)"/>
  <rect x="32.5" y="17" width="6" height="27" rx="3" fill="url(#fBar)"/>
  <rect x="41"   y="23" width="6" height="21" rx="3" fill="url(#fBar)"/>
  <!-- L -->
  <rect x="15" y="16" width="6" height="28" rx="3" fill="url(#fL)"/>
  <rect x="15" y="44" width="32" height="5" rx="2.5" fill="url(#fL)"/>
</svg>
