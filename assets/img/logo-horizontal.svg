<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 72" role="img" aria-label="LA Software House">
  <defs>
    <linearGradient id="emGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67bff"/>
      <stop offset="0.5" stop-color="#6d5cff"/>
      <stop offset="1" stop-color="#22e3d6"/>
    </linearGradient>
    <linearGradient id="tHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Chip -->
  <rect x="4" y="4" width="64" height="64" rx="17" fill="#12121c"/>
  <rect x="4" y="4" width="64" height="64" rx="17" fill="url(#tHi)"/>
  <rect x="4.8" y="4.8" width="62.4" height="62.4" rx="16.3" fill="none" stroke="url(#emGrad)" stroke-width="1.4" stroke-opacity="0.85"/>

  <!-- Emblema "L dentro do A" — bold e limpo (centro 36) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 56 L36 14 L58 56" stroke="url(#emGrad)" stroke-width="5.5"/>
    <path d="M23 51 L36 28 L49 51" stroke="url(#emGrad)" stroke-width="3.6"/>
  </g>
  <circle cx="36" cy="42" r="10.5" fill="#ffffff" opacity="0.07"/>
  <path d="M33 35 L33 48 L44 48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 7 L38 12.4 L43 14.4 L38 16.4 L36 22 L34 16.4 L29 14.4 L34 12.4 Z" fill="#ffffff"/>

  <!-- Wordmark — uma linha, grande e legível -->
  <text x="84" y="40" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="33" font-weight="700" fill="#f5f6fb" letter-spacing="-0.8">Software House</text>
  <text x="85" y="58" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" font-weight="500" fill="#37eadd" letter-spacing="4">DIGITAL · APPS · SAAS</text>
</svg>
