<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" role="img" aria-label="LA Software House">
  <defs>
    <!-- Barras: ciano (topo) → violeta (base) -->
    <linearGradient id="laBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee7da"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <!-- L branco com leve modelagem -->
    <linearGradient id="laL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ddff"/>
    </linearGradient>
    <!-- Acento do "LA" no texto -->
    <linearGradient id="laInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#2ee7da"/>
    </linearGradient>
  </defs>

  <!-- ===== MARCA: barras (prédio) + L, minimalista ===== -->
  <!-- barras do skyline (base compartilhada em y=52) -->
  <rect x="21"   y="30" width="7.5" height="22" rx="3.75" fill="url(#laBar)"/>
  <rect x="31.5" y="16" width="7.5" height="36" rx="3.75" fill="url(#laBar)"/>
  <rect x="42"   y="24" width="7.5" height="28" rx="3.75" fill="url(#laBar)"/>
  <rect x="52.5" y="37" width="6.5" height="15" rx="3.25" fill="url(#laBar)"/>
  <!-- L: pilar + fundação (a fundação passa por baixo das barras) -->
  <rect x="9" y="14" width="7.5" height="44" rx="3.75" fill="url(#laL)"/>
  <rect x="9" y="52.5" width="50" height="6" rx="3" fill="url(#laL)"/>

  <!-- ===== Wordmark: LA Software House ===== -->
  <text x="78" y="45" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">
    <tspan fill="url(#laInk)">LA</tspan><tspan fill="#f5f6fb"> Software House</tspan>
  </text>
</svg>
