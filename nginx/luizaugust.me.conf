# ==========================================================================
#  /etc/nginx/sites-available/luizaugust.me
#
#  Instalar (ou use o nginx/criar_site.sh, que faz tudo):
#    sudo cp nginx/luizaugust.me.conf /etc/nginx/sites-available/luizaugust.me
#    sudo ln -s /etc/nginx/sites-available/luizaugust.me /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Depois rode o certbot (ele reescreve este arquivo acrescentando o bloco 443
#  e o redirecionamento). Não edite as linhas que o certbot inserir.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name luizaugust.me www.luizaugust.me;

    # O painel envia imagem em base64 dentro do JSON. O padrão do nginx é 1 MB —
    # sem isto, subir uma imagem de projeto devolve 413 e o upload falha.
    client_max_body_size 25m;

    access_log /var/log/nginx/luizaugust.access.log;
    error_log  /var/log/nginx/luizaugust.error.log;

    # Metadados de repositório nunca devem sair pela web. O server.js já bloqueia,
    # mas aqui a porta fecha antes mesmo de chegar na aplicação.
    location ~ /\.(git|env|gitignore) {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    #  Página de manutenção quando a APLICAÇÃO está fora do ar.
    #  Cobre restart, deploy e queda — quando não há app para responder.
    #  Sem isto o visitante veria a tela cinza de "502 Bad Gateway".
    # ------------------------------------------------------------------
    error_page 502 503 504 /manutencao.html;
    location = /manutencao.html {
        root /var/www/projetos/LA-Software-House;
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sem estes dois a aplicação enxerga todo mundo como 127.0.0.1: o cookie
        # de sessão do painel não receberia a marca Secure e a trava de tentativas
        # de login por IP passaria a valer para o servidor inteiro, não por
        # visitante — bastaria alguém errar 5 vezes para travar todo mundo.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
